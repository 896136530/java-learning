# ============================================================
# Day 32：参数校验深入（分组校验 + 自定义校验注解）
#
# ⭐ 和 Day31 一样：**今天不需要数据库**（数据在 SkuService 的内存 Map 里）。
#    今天的主题是"怎么定义校验规则"，数据放哪儿跟它没关系 ——
#    内存反而更好：重启就恢复 3 条初始 SKU，方便你反复测各种错误参数。
#
# 📌 复习（Day30 学过的"配置外置"）：改端口只改下面这一行，代码一行不用动
# ============================================================

# ---------- ① 端口 ----------
server.port=8080

# ---------- ② 应用名（日志里会显示）----------
spring.application.name=day32-springboot

# ---------- ③ 关掉数据库自动配置（今天用不上）----------
# ⚠️ pom 里有 data-jpa + h2，SpringBoot 会**自动**去找实体类/Repository。
#    我们一个都没有，不关掉启动时会刷一堆"找不到 Entity"的警告。
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ---------- ④ 错误处理相关 ----------
#    include-message=always → SpringBoot 自带的错误响应里也带上异常消息
#    （⚠️ 只影响 SpringBoot **自带**的错误页；我们的 @RestControllerAdvice 一旦接住就走我们的格式）
server.error.include-message=always
#    是否在默认错误响应里带堆栈（生产环境必须 never，会泄露内部信息）
server.error.include-stacktrace=never

# ---------- ⑤ 日志级别 ----------
logging.level.org.springframework.web=info
#    ⭐ 打开这行，你能在控制台看到 GlobalExceptionHandler 打的 warn/error
logging.level.com.xiaoming.day32=debug
#    ⭐ 今天新增这一行：把"校验相关"的日志也打开
#    这样第 1 步/第 7 步观察 ConstraintViolationException 时，能在日志里看到它到底被谁接住了
logging.level.org.springframework.validation=info

# ---------- ⑥ 让 JSON 输出好看点（可选）----------
spring.jackson.serialization.indent-output=true