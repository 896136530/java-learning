# ============================================================
# Day 31：全局异常处理 + 统一响应
#
# ⭐ 今天**不需要数据库**（Day30 的 H2 已经玩过）——
#    今天的主题是"出错时怎么优雅地返回"，数据放内存里反而更干净：
#    重启就恢复初始 3 条 SKU，方便你反复测各种错误。
#    所以这个文件比 Day30 的短得多，只留必要的东西。
#
# 📌 顺便复习（Day30 学过的"配置外置"）：改端口只改这一行，代码一行不用动
# ============================================================

# ---------- ① 端口 ----------
server.port=8080

# ---------- ② 应用名（日志里会显示）----------
spring.application.name=day31-springboot

# ---------- ③ 关掉数据库自动配置（今天用不上）----------
# ⚠️ 如果 pom 里有 data-jpa + h2，SpringBoot 会**自动**去连数据库。
#    我们没有实体类/Repository，不关闭的话启动会有一堆"找不到 Entity"的警告。
#    这三种写法都能关，任选一种（这里是"排除自动配置类"）：
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ---------- ④ 错误处理相关（⭐ 今天的重点配置）----------
#    include-message=always  → SpringBoot 自带的默认错误响应里也带上异常消息
#      （不配这个的话，默认错误页里的 message 是空的 —— 你会以为"异常丢了"）
#    ⚠️ 重要认知：这条只影响 **SpringBoot 自带** 的错误页；
#       我们自己的 @RestControllerAdvice 一旦接住异常，就走我们的格式了，跟这条无关。
server.error.include-message=always
#    是否在默认错误响应里带堆栈（**生产环境必须是 never**，会泄露内部信息）
server.error.include-stacktrace=never

# ---------- ⑤ 日志级别 ----------
#    Spring 的 web 日志（能看到"哪个请求进了哪个 Controller"）
logging.level.org.springframework.web=info
#    ⭐ 打开这行，你能在控制台看到我们 GlobalExceptionHandler 打的 warn/error
logging.level.com.xiaoming.day31=debug

# ---------- ⑥ 让 JSON 输出好看点（可选）----------
#    默认 JSON 是一行，日志里/浏览器里都不好读
spring.jackson.serialization.indent-output=true