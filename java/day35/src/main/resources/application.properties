# ============================================================
# Day 35：换真 MySQL（H2 → MySQL）+ 还"数据库约束"的债
#
# ⭐ 这份配置是**交付版（H2 起步）**。今天要动的地方标了 TODO②。
#
# ⚠️⚠️ 端口是 8081，不是 8080！
#    学生机器上 8080 被另一个项目（day33 的 jar）占着 —— 别去动它，我们用 8081。
#    （Day34 的批改就是被这件事绊过一次：跑出来的证据其实是 8080 上另一个项目的。）
# ============================================================

# ---------- ① 端口 ----------
server.port=8081

# ---------- ② 应用名（日志里会显示）----------
spring.application.name=day35-springboot

# ============================================================
# ③ 数据源（数据库连接）—— ⭐⭐ TODO②（第 4 步）：从 H2 换成 MySQL
# ============================================================
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ 现在（交付版）：H2 内存库                                                 │
# └──────────────────────────────────────────────────────────────────────────┘
#   mem:day35                → 内存库，库名 day35
#   DB_CLOSE_DELAY=-1        → 整个 JVM 活着期间，**所有连接都断开也别删库**
#                              （不加这一行，连接池空闲收连接时库就没了，
#                                你会看到"表不存在"—— 连接池知识点的活教材）
#spring.datasource.url=jdbc:h2:mem:day35;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# ┌──────────────────────────────────────────────────────────────────────────┐
# │ ⭐ TODO② 目标：真 MySQL（第 4 步做完后，把上面 4 行换成下面 4 行）          │
# └──────────────────────────────────────────────────────────────────────────┘
#
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/day35?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
#
# ⭐⭐⭐ 这份 url 里有 4 个参数 + 1 个地址写法，**每一条都看明白**（都是真机踩出来的）：
#
#   · useSSL=false
#       ⚠️ 先纠正一个"网络传言"：本机实测**不写这个参数也不报错、不警告，照样连上**。
#          写它只是为了"明确表态"，不是为了消错。
#       生产环境**不能**关 SSL —— 这里关是因为"本机 root/root、只连 127.0.0.1"。
#
#   · serverTimezone=Asia/Shanghai     ⭐ 结论：**不写也能连**，但写上更稳。
#       ⚠️ 网上很多老文章说"不写就报时区错"——那是**老版本驱动**（5.x 时代）的行为。
#          本机实测（MySQL 8.4.5 + Connector-J 8.4.0）：**裸 url 一个字不写也连得上**。
#       ⭐ 真正会报错的是下面这两种（都是真机原文，别抄错）：
#         ① 写 `connectionTimeZone=SERVER`（老名字 `serverTimezone=SERVER` 同理）
#              The server time zone value '?й???׼ʱ?' is unrecognized or represents more than
#              one time zone. You must configure either the server or JDBC driver (via the
#              'connectionTimeZone' configuration property) to use a more specific time zone value
#            ⭐ 那串乱码是你本机 Windows 的时区名（"中国标准时间"）在驱动眼里解不开的样子；
#              根因是本机 MySQL 的时区表是空的（实测 `mysql.time_zone_name` 行数 = 0）。
#         ② 写 `connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true`
#              Unknown or incorrect time zone: 'Asia/Shanghai'
#            （服务端时区表为空 → 驱动想去 `SET time_zone='Asia/Shanghai'`，MySQL 不认 → 1298）
#         ③ 写一个不存在的时区名（如 `serverTimezone=NotAZone`）
#              java.time.zone.ZoneRulesException: Unknown time-zone ID: NotAZone
#            （这个是 **Java 自己**报的，连数据库都没连上 —— 说明这个参数是给驱动/Java 用的）
#       ⭐ 所以我们的选择是：**明确写 serverTimezone=Asia/Shanghai** ——
#          这样"不管本机还是服务器、不管时区表空不空"，时间口径都被钉死，少一类玄学问题。
#       📌 注意这个参数是**连接参数**（放在 url 里给驱动看的），
#          和我们代码里用的 `ZoneId.of("Asia/Shanghai")` 是两回事，别混。
#
#   · characterEncoding=???     ⭐⭐ 这个参数**不能写 utf8mb4**！这是本包挖到的最大一个坑：
#       计划文档里给的示例是 `characterEncoding=utf8mb4`，**真机一跑就崩**（实测原文）：
#         java.sql.SQLException: Unsupported character encoding 'utf8mb4'
#         Caused by: java.io.UnsupportedEncodingException: utf8mb4
#       原因：`characterEncoding` 是**给 Java 驱动看的**（它要拿这个值去调
#             `String.getBytes(charsetName)`），而 Java 的字符集表里只有 `UTF-8` /
#             `utf8`，**没有 `utf8mb4` 这个名字**（utf8mb4 是 **MySQL 那边**的字符集名）。
#       → 正确写法是 `characterEncoding=UTF-8`。
#       → "到底是不是 utf8mb4"要看**服务端/库/表**（`SHOW CREATE TABLE`、
#         information_schema 的 CHARACTER_SET_NAME），**不是**看这个参数。
#       ⭐ 一句话：**驱动参数写 UTF-8，建库建表写 utf8mb4。** 两边是两套命名。
#       （实测：只写 characterEncoding=UTF-8、甚至一个字都不写，协商结果都是
#        character_set_client=utf8mb4 / character_set_connection=utf8mb4。）
#
#   · allowPublicKeyRetrieval=true
#       MySQL 8 默认用 caching_sha2_password 认证，第一次连接要取服务端公钥；
#       不给这个参数，某些情况下会报
#         `Public Key Retrieval is not allowed`。
#       （本机测试时不一定每次都触发，但写上更省事。）
#
#   · 127.0.0.1 而不是 localhost
#       本机开发一个小习惯：`localhost` 有可能先走 IPv6（::1）再回落到 IPv4，
#       慢的时候你会以为是"数据库卡了"。写 127.0.0.1 直接走 IPv4。

# ---------- ④ H2 网页控制台 ----------
#   浏览器打开 http://localhost:8081/h2-console
#   JDBC URL 填 jdbc:h2:mem:day35，用户名 sa，密码留空 → 就能**自己敲 SQL**看表了。
#   ⭐ TODO② 换成 MySQL 之后，这个控制台就**没用了**（它只能连 H2），
#     那时候你要改用 mysql 命令行：`E:\mysql\bin\mysql.exe -u root -proot day35`
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# ⑤ 建表/种子数据的方式
# ============================================================
#   交付版**不用** schema.sql / data.sql，而是用 db/DataInitializer.java 里的
#   @PostConstruct 手动建表 + 插种子数据 —— 理由：能打日志、能写注释、
#   能被 /db/reset 重新调用（每次做实验前一键复位）。这里把自动初始化关掉，免得两套打架。
# ⭐⭐ TODO③（第 5 步）已完成：建表交给 schema.sql，Java 侧只做自检 + 插种子
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=false
#    （三个参数的作用见练习题第 5 步；`never`→`always` 就是"谁来建表"的开关）

# ---------- ⑥ 错误处理相关 ----------
server.error.include-message=always
server.error.include-stacktrace=never

# ---------- ⑦ 日志级别 ----------
logging.level.org.springframework.web=info
#    ⭐ 打开这行，你能在控制台看到 GlobalExceptionHandler 打的 warn/error
logging.level.com.xiaoming.day35=debug
#    ⭐ 事务相关的日志（Day34 传下来的，Day35 一行没改）：
#
#    ⚠️⚠️ 下面这两行的"实际效果"Day34 已经独立复验核对过（2026-10-18），照着记：
#
#    ① logging.level.org.springframework.jdbc.support=debug   ← 【真正给出事务日志的是这一行】
#       本项目用的是 JdbcTransactionManager，它的 logger 叫
#       `org.springframework.jdbc.support.JdbcTransactionManager` —— 在 **jdbc.support** 包下。
#       所以下面这些原文都是从**这一行**开出来的：
#         Creating new transaction with name [...OrderService.place]: PROPAGATION_REQUIRED,...
#         Participating in existing transaction
#         Initiating transaction commit / Initiating transaction rollback
#       ⚠️ 但它**看不到 SQL**：JdbcTemplate 的 logger 在 `org.springframework.jdbc.core` 包。
logging.level.org.springframework.jdbc.support=debug
#
#    ② logging.level.org.springframework.transaction=debug   ← 【开着也无害，但一条日志都不产生】
#       本项目**没有** DataSourceTransactionManager（那是 JPA / 老式 JDBC 集成的写法），
#       复验实测：产生 0 行日志。
logging.level.org.springframework.transaction=debug
#
#    ⭐ ③ Day35 新增：想看 **HikariCP 连接池**的动作（启动/借出/归还/超时）就打开这一行。
#       打开后你会看到形如：
#         HikariPool-1 - Starting...
#         HikariPool-1 - Start completed.
#         HikariPool-1 - configuration:
#           maximumPoolSize.................10        ← 默认就是 10
#         HikariPool-1 - Pool stats (total=10, active=0, idle=10, waiting=0)
#       ⭐ 这一个 "configuration" 段就把今天要学的参数全列出来了，
#         比你背 `maximum-pool-size 默认 10` 有用得多 —— 第 9 步会用到。
logging.level.com.zaxxer.hikari=debug
#
#    ⭐ ④ 想自己看 JdbcTemplate 真正执行的 SQL（例如 `Executing prepared SQL statement [INSERT INTO sku ...]`），
#       就把下面这行前面的 `#` 去掉。默认**关着**，免得日志太吵：
# logging.level.org.springframework.jdbc.core=debug