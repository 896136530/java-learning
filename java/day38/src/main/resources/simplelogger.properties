# slf4j-simple 的配置（MyBatis 通过它打日志）
# 默认 warn：只打警告/错误，控制台干净（学习时不需要看框架内部日志）
#
# 想看 MyBatis 真正发出的 SQL 和参数？用 运行Day38.bat 的菜单 4：
#   java -Dorg.slf4j.simpleLogger.defaultLogLevel=debug -jar target\day38-mybatis.jar
org.slf4j.simpleLogger.defaultLogLevel=warn

# 就算开了 debug，也把 MyBatis 框架自己的内部日志压到 info（否则一堆 VFS/连接池噪音）
org.slf4j.simpleLogger.log.org.apache.ibatis=info

org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
