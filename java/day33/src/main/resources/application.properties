# ============================================================
# Day 33：拦截器 / 过滤器
#
# ⭐ 和 Day31/32 一样：**今天不需要数据库**（数据在 SkuService 的内存 Map 里）。
#    今天的主题是"请求进 Controller 之前/之后能干什么"，跟数据存哪儿毫无关系。
#
# 📌 复习（Day30 学过的"配置外置"）：改端口只改下面这一行，代码一行不用动
# ============================================================

# ---------- ① 端口 ----------
server.port=8080

# ---------- ② 应用名（日志里会显示）----------
spring.application.name=day33-springboot

# ---------- ③ 关掉数据库自动配置（今天用不上）----------
# ⚠️ pom 里有 data-jpa + h2，SpringBoot 会**自动**去找实体类/Repository。
#    我们一个都没有，不关掉启动时会刷一堆"找不到 Entity"的警告。
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ---------- ④ 错误处理相关 ----------
#    include-message=always → SpringBoot 自带的错误响应里也带上异常消息
#    （⚠️ 只影响 SpringBoot **自带**的错误页；我们的 @RestControllerAdvice 一旦接住就走我们的格式）
server.error.include-message=always
#    是否在默认错误响应里带堆栈（生产环境必须 never，会泄露内部信息）
server.error.include-stacktrace=never

# ---------- ⑤ 日志级别 ----------
logging.level.org.springframework.web=info
#    ⭐ 打开这行，你能在控制台看到 GlobalExceptionHandler 打的 warn/error
logging.level.com.xiaoming.day33=debug
#    ⭐ 今天新增：把 DispatcherServlet 的日志打开，能看到它"把请求交给了哪个 handler"
#    （第 2 步观察"/abc 走不走拦截器"时，这行日志是证据）
logging.level.org.springframework.web.servlet.DispatcherServlet=debug