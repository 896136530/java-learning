# ============================================================
# Day 30：SpringBoot 的配置文件
#
# ⭐ 老朋友了！这就是 Day29 Ex3 教你的"配置文件"——
#    位置一模一样：src/main/resources/
#    读法一模一样的道理：跟着代码走（打进 jar 里）
#    区别：SpringBoot 会**自动读**这个文件（名字必须是 application.properties）
#          Day29 你要自己写代码调 Hold.readResource("db.properties")
# ============================================================

# ---------- ① 换个端口试试"配置外置" ----------
# 默认 8080。改成 8081 重启，启动日志会变成 "Tomcat started on port 8081"
server.port=8080

# ---------- ② 应用名（启动日志和监控里会显示）----------
spring.application.name=day30-springboot

# ============================================================
# ③ H2 内存数据库：为什么用它，而不是你装了 4 天的 MySQL？
#
#    因为今天要学的是 **SpringBoot**，不想让你在"数据库连不上"上再耗时间。
#    H2 是一个纯 Java 写的数据库，**和程序跑在同一个进程里**：
#      · 不用安装、不用启动服务、不用密码、不用建库建表
#      · 程序一关，数据就没了（名字里的 mem = memory 内存）
#
#    这正好让你重看 Day26 的一个问题：
#      "数据库可以是一个独立的服务，也可以只是程序里的一个库"
#
#    ⚠️ 等等，这个思路不陌生吗？—— 对，H2 就是**数据库界的"内嵌 Tomcat"**：
#       Tomcat 不用单独装（内嵌在程序里），H2 也不用单独装（内嵌在程序里）。
#       SpringBoot 的设计哲学就是这个：**让"外部依赖"变成"内部组件"，开发时零配置**。
# ============================================================
spring.datasource.url=jdbc:h2:mem:day30db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- ④ 打开 H2 的网页控制台（今天的一件乐事）----------
#    启动后浏览器访问：http://localhost:8080/h2-console
#    进去后把 JDBC URL 填成上面那串（jdbc:h2:mem:day30db...），用户名 sa，密码留空，点 Connect
#    → 你会在网页里**直接看到 task 表和数据**，还能敲 SQL
#    → 📌 这就是"数据库客户端"的入门版（比 Navicat 简陋，但原理一样：连上去、发 SQL、看结果）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- ⑤ JPA / Hibernate 行为 ----------
#    update  = 启动时按实体类自动建表/改表（表不存在就建）
#    show-sql = 把 Hibernate 生成的 SQL **打印到控制台** ← 强烈建议保持 true
#              （你会亲眼看到：你一个 SQL 都没写，它自己发出去的 SQL 长什么样）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- ⑥ 日志级别 ----------
#    SpringBoot 默认日志很吵，这里挑几个看
logging.level.org.hibernate.SQL=info
logging.level.org.springframework.web=info

