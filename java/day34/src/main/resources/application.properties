# ============================================================
# Day 34：Spring 事务管理 @Transactional
#
# ⭐ 和 Day31/32/33 最大的区别：**今天必须真有一个数据库**。
#    前三天用 spring.autoconfigure.exclude 把 DataSource 关掉了（隔离无关变量），
#    今天不行 —— 事务是数据库的行为，没库就没事务可谈。
#
# 用 H2 内存库（jdbc:h2:mem:day34）：
#   · 不用装、不用起服务、不用建库 —— 跑起来就有
#   · 数据只活在**这个 Java 进程**里：进程一停就没了（下次启动又是那 3 条种子数据）
#   · ⚠️ "进程重启数据复位" 和 "事务回滚" 是**两件完全不同的事**，别混（知识点第 13 节）
#   · Day35 把这里换成真的 MySQL（url 改一行、驱动换一个，代码基本不动）
# ============================================================

# ---------- ① 端口 ----------
server.port=8080

# ---------- ② 应用名（日志里会显示）----------
spring.application.name=day34-springboot

# ---------- ③ 数据源（H2 内存库）----------
#   mem:day34                → 内存库，库名 day34
#   DB_CLOSE_DELAY=-1        → 整个 JVM 活着期间，**所有连接都断开也别删库**
#                              （不加这一行，连接池空闲收连接时库就没了，你会看到"表不存在"）
spring.datasource.url=jdbc:h2:mem:day34;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- ④ H2 网页控制台（⭐ 今天很值得亲手开一次）----------
#   浏览器打开 http://localhost:8080/h2-console
#   JDBC URL 填 jdbc:h2:mem:day34，用户名 sa，密码留空 → 就能**自己敲 SQL**看表了
#   （这是"查库取证"最直观的方式；我们的 /db/** 接口是它的自动化版本）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- ⑤ 建表/种子数据的方式 ----------
#   我们**不用** schema.sql / data.sql（那两个是"文件式"的初始化），
#   而是用 db/DataInitializer.java 里的 @PostConstruct 手动建表 + 插种子数据 ——
#   理由：能打日志、能写注释、能被 /db/reset 重新调用（每次做实验前一键复位）。
#   这里把自动初始化关掉，免得两套打架。
spring.sql.init.mode=never

# ---------- ⑥ 错误处理相关 ----------
server.error.include-message=always
server.error.include-stacktrace=never

# ---------- ⑦ 日志级别 ----------
logging.level.org.springframework.web=info
#    ⭐ 打开这行，你能在控制台看到 GlobalExceptionHandler 打的 warn/error
logging.level.com.xiaoming.day34=debug
#    ⭐ 今天新增：把事务相关的日志打开（能看到"事务开始了 / 回滚了"这类底层动作）
#
#    ⚠️⚠️ 下面这两行的"实际效果"已经独立复验核对过（2026-10-18），和直觉不一样，照着记：
#
#    ① logging.level.org.springframework.jdbc.support=debug   ← 【真正给出事务日志的是这一行】
#       本项目用的是 JdbcTransactionManager，它的 logger 名字叫
#       `org.springframework.jdbc.support.JdbcTransactionManager` —— 在 **jdbc.support** 包下，
#       **不在** transaction 包下。所以下面这些原文都是从**这一行**开出来的：
#         Creating new transaction with name [...OrderService.place]: PROPAGATION_REQUIRED,...
#         Participating in existing transaction
#         Initiating transaction commit / Initiating transaction rollback
#       ⚠️ 但它**看不到 SQL**：JdbcTemplate 的 logger 在 `org.springframework.jdbc.core` 包，
#          不归 jdbc.support 管 —— 别指望这行能打出 SQL（这是本文件早期注释写错的地方，已改）。
logging.level.org.springframework.jdbc.support=debug
#
#    ② logging.level.org.springframework.transaction=debug   ← 【今天开着也无害，但一条日志都不产生】
#       本项目**没有** DataSourceTransactionManager（那是 JPA / 老式 JDBC 集成的写法），
#       日志里也**没有任何** logger 以 `org.springframework.transaction.` 开头，
#       所以这行**什么都看不到**（复验实测：产生 0 行日志）。
#       留着它是为了 Day35 换成 JPA 之后对比差别。
logging.level.org.springframework.transaction=debug
#
#    ⭐ ③ 那"JdbcTemplate 真正执行的 SQL 与参数"到底怎么开？—— 把 **core** 打开：
#       想自己看 SQL（例如 `Executing prepared SQL statement [INSERT INTO orders ...]`），
#       就把下面这行前面的 `#` 去掉。默认**关着**，免得日志太吵：
# logging.level.org.springframework.jdbc.core=debug